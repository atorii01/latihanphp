            case 'home':
                include 'home.php';
                break;
            case 'about':
                include 'about.php';
                break;
            case 'contact':
                include 'contact.php';
                break;
            default:
                echo "<h2>404 - Halaman Tidak Ditemukan</h2>";
                echo "<p>Maaf, halaman yang Anda cari tidak ada.</p>";
